# Главный конфиг раздачи витрин новых тем (design.md блока 5, В5-3 А): свой образ рядом с прокси нынешних магазинов.
# Модуль njs грузится здесь, раздача — в storefront.conf.template: переменные окружения в него подставляет образ nginx.
load_module modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    include /etc/nginx/conf.d/storefront.conf;
}
