# Прокси перед MinIO стенда (compose.test.yml): сжимает любой ответ, если клиент принимает gzip, — как прокси перед
# хранилищем на dev и в проде.
server {
    listen 9000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1;
    gzip_types *;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
    }
}
